name: Workflow security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: actionlint and zizmor
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          check-latest: false

      - name: Install actionlint
        shell: pwsh
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          $goBin = Join-Path ((go env GOPATH).Trim()) 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $goBin 'actionlint.exe'))) { throw 'actionlint installation failed.' }
          $goBin | Add-Content -LiteralPath $env:GITHUB_PATH

      - name: Install zizmor
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --user --requirement requirements-ci.txt
          $userScripts = Join-Path (python -c 'import site; print(site.getuserbase())') 'Scripts'
          if (-not (Test-Path -LiteralPath (Join-Path $userScripts 'zizmor.exe'))) { throw 'zizmor installation failed.' }
          $userScripts | Add-Content -LiteralPath $env:GITHUB_PATH

      - name: Validate workflow syntax and security
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Validate-GitHubWorkflows.ps1
